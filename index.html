<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>PAX MUNDI — Grande Stratégie</title>
<style>
:root{--bg:#0b1220;--panel:#111a2c;--border:#23324d;--txt:#dbe4f0;--dim:#8fa0b8;--acc:#3b82f6;--ok:#10b981;--bad:#ef4444;--warn:#eab308}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.45 'Segoe UI',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#topbar{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
#topbar h1{font-size:17px;letter-spacing:2px;color:var(--acc)}
.res{display:flex;gap:14px;flex-wrap:wrap}
.res span{white-space:nowrap}
.res b{color:#fff}
#main{display:flex;flex:1;min-height:0}
#mapwrap{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;background:#08101c}
canvas{cursor:crosshair;border:1px solid var(--border)}
#side{width:390px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1px solid var(--border)}
#tabs button{flex:1;padding:9px 4px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:13px;border-bottom:2px solid transparent}
#tabs button.on{color:#fff;border-bottom-color:var(--acc)}
#panel{flex:1;overflow-y:auto;padding:12px}
#panel h3{margin:10px 0 6px;font-size:14px;color:var(--acc)}
#panel h4{margin:8px 0 4px;font-size:13px}
#panel .card{background:#0d1526;border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:10px}
#panel button{background:#1c2a45;color:var(--txt);border:1px solid var(--border);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12.5px;margin:2px 4px 2px 0}
#panel button:hover{background:#27395e}
#panel button:disabled{opacity:.4;cursor:default}
#panel button.danger{border-color:#7f1d1d;color:#fca5a5}
#panel button.ok{border-color:#065f46;color:#6ee7b7}
#panel select,#panel input[type=range]{margin:2px 0}
#panel small{color:var(--dim)}
.unitrow{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px dashed #1c2942;font-size:12.5px}
.bar{height:4px;background:#1c2942;border-radius:2px;margin-top:3px}
.bar i{display:block;height:100%;border-radius:2px;background:var(--ok)}
.relbar{height:6px;background:#1c2942;border-radius:3px;position:relative;margin:4px 0}
.relbar i{position:absolute;top:0;bottom:0;border-radius:3px}
.tag{display:inline-block;padding:1px 6px;border-radius:10px;font-size:11px;margin:1px 2px;border:1px solid var(--border)}
.tag.on{background:#123055;color:#9ec5ff;border-color:#2b527f}
#toasts{position:fixed;top:60px;right:410px;z-index:50;display:flex;flex-direction:column;gap:6px;max-width:340px}
.toast{background:#16233c;border:1px solid var(--acc);border-radius:8px;padding:8px 12px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.5);animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateX(20px)}to{opacity:1}}
#overlay{position:fixed;inset:0;background:rgba(4,8,16,.92);z-index:100;display:flex;align-items:center;justify-content:center}
#overlay .box{max-width:760px;max-height:86vh;overflow-y:auto;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:26px 30px}
#overlay h2{color:var(--acc);letter-spacing:3px;margin-bottom:10px}
#overlay h3{color:#fff;margin:14px 0 4px;font-size:15px}
#overlay p,#overlay li{color:var(--dim);font-size:13.5px}
#overlay ul{margin:4px 0 4px 20px}
#overlay .big{display:block;margin:18px auto 0;background:var(--acc);color:#fff;border:none;border-radius:8px;padding:10px 34px;font-size:16px;cursor:pointer}
.logentry{padding:4px 0;border-bottom:1px dashed #1c2942;font-size:12.5px}
.logentry .t{color:var(--dim);margin-right:6px}
.logentry.war{color:#fca5a5}.logentry.dip{color:#9ec5ff}.logentry.eco{color:#fcd34d}.logentry.good{color:#6ee7b7}
</style>
</head>
<body>
<div id="topbar">
  <h1>PAX MUNDI</h1>
  <div class="res" id="resbar"></div>
  <div style="flex:1"></div>
  <span id="turnlab" style="color:var(--dim)"></span>
  <button id="helpbtn" style="background:#1c2a45;color:#dbe4f0;border:1px solid #23324d;border-radius:6px;padding:5px 12px;cursor:pointer">Aide</button>
  <button id="endbtn" style="background:#1d4ed8;color:#fff;border:none;border-radius:6px;padding:7px 18px;cursor:pointer;font-weight:bold">Fin du tour ▶</button>
</div>
<div id="main">
  <div id="mapwrap"><canvas id="map" width="960" height="600"></canvas></div>
  <div id="side">
    <div id="tabs">
      <button data-tab="prov" class="on">Province</button>
      <button data-tab="eco">Économie</button>
      <button data-tab="dip">Diplomatie</button>
      <button data-tab="log">Journal</button>
    </div>
    <div id="panel"></div>
  </div>
</div>
<div id="toasts"></div>
<div id="overlay"><div class="box" id="introbox"></div></div>
<script src="game.js"></script>
</body>
</html>
