name: Deploy PAX MUNDI (GitHub Pages)
on:
  push:
    branches: ["vibe/pax-mundi-jeu-e26371", "main"]
  workflow_dispatch:
permissions:
  contents: read
  administration: write
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurer Pages (creation automatique du site)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Uploader le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deployer vers GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
